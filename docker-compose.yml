# Self-hosted n8n for the LXG outreach pilot.
#   cp .env.example .env   (edit it)   &&   docker compose up -d
# SQLite (n8n default) is plenty for a few hundred leads/week — no PostgreSQL needed for the pilot.
# Caddy provides HTTPS so Instantly can reach the reply webhook. Skip the `caddy` service if you
# already have a reverse proxy / tunnel (then publish n8n's port yourself and set WEBHOOK_URL).
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:?set N8N_VERSION in .env}
    restart: unless-stopped
    env_file: .env
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=https://${N8N_HOST}/
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/London}
      - TZ=${GENERIC_TIMEZONE:-Europe/London}
      # workflows read configuration with $env.*
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # CSV fallback may only read from /files
      - N8N_RESTRICT_FILE_ACCESS_TO=/files
      # keep history (needed for troubleshooting), prune after N hours
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=false
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=${EXECUTIONS_DATA_MAX_AGE:-720}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./import:/files/import
      - ./workflows:/workflows:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    expose:
      - "5678"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - n8n
    ports:
      - "80:80"
      - "443:443"
    environment:
      - N8N_HOST=${N8N_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  n8n_data:
  caddy_data:
  caddy_config:
